services:
  subhub:
    image: ${PARVMARZ_IMAGE:-ghcr.io/parvanezone/parvmarz}:latest
    build:
      context: .
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${PANEL_PORT:-${PORT:-8000}}:8000"
      - "${SUB_BIND:-127.0.0.1}:${SUB_PORT:-8001}:8001"
    volumes:
      - subhub_data:/app/data
      - ./certs:/etc/letsencrypt:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-m", "cli.health"]
      interval: 30s
      timeout: 6s
      start_period: 40s
      retries: 3
volumes:
  subhub_data:
