[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "subhub"
version = "0.1.0"
description = "Central subscription aggregation panel"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0",
  "pydantic-settings>=2.4", "httpx>=0.27", "PyJWT>=2.9",
  "bcrypt>=4.2", "cryptography>=43", "typer>=0.12", "apscheduler>=3.10", "alembic>=1.13",
  "python-multipart>=0.0.9", "PyYAML>=6.0"
]
[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6", "mypy>=1.11"]
[project.scripts]
subhub-cli = "cli.main:app"
[tool.setuptools.packages.find]
include = ["app*", "cli*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
target-version = "py312"
