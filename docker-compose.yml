services:
  subhub:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - subhub_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  subhub_data:
