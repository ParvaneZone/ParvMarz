services:
  subhub:
    image: ${PARVMARZ_IMAGE:-ghcr.io/parvanezone/parvmarz}:latest
    build:
      context: .
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - subhub_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
volumes:
  subhub_data:
